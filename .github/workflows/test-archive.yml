in github action i have this folder to get openTimeStamped and then upload to my google drive folder the timeStamped one and orignal oneTo timestamp your folder using OpenTimestamps (OTS) and upload both the original and timestamped files to Google Drive, you need to add a few steps to your GitHub Actions workflow.You will need to install the OpenTimestamps CLI, timestamp the files, and use a tool like rclone or a dedicated GitHub Action to authenticate and upload to Google Drive.Here is a complete, structured example of how to update your GitHub Actions workflow:Updated GitHub Actions Workflowyaml- name: Upload Static Download Artifact 
  uses: actions/upload-artifact@v4 
  with: 
    name: archive-static-download-folder 
    path: public/ 
    retention-days: 90

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.x'

- name: Install OpenTimestamps CLI
  run: |
    pip install opentimestamps-client

- name: Create OpenTimestamps for public folder
  run: |
    # This creates .ots files for every file inside the public/ folder
    ots stamp public/**/*

- name: Upload to Google Drive
  uses: adityassubramanian/gdrive-upload-action@v1.1
  with:
    credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
