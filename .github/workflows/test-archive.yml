name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    # Allow this workflow to deploy the static viewer to GitHub Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # Get the exact fork/commit being tested.
      - name: Checkout source
        uses: actions/checkout@v4


      # Build your ArchiveBox fork, including yt-dlp + EJS.
      - name: Build ArchiveBox image
        run: |
          docker build -t my-archivebox .


      # Create a temporary YouTube authentication file.
      # It is kept outside the archive and never uploaded as an artifact.
      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"


      # Initialize ArchiveBox AND install all documented runtime dependencies.
      # Added --init to prevent zombie process lockups during setup.
      - name: Initialize and install ArchiveBox
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

          docker run --rm \
            --init \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install


      # Archive the requested URL.
      # Added --init so that background extraction processes terminate cleanly on GitHub Actions.
      - name: Archive URL
        run: |
          docker run --rm \
            --init \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YTDLP_ENABLED=true \
            -e YTDLP_BINARY=yt-dlp \
            -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
            my-archivebox \
            add "${{ inputs.url }}"


      # Remove the authentication credential immediately after archiving.
      - name: Remove temporary cookies
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cookies.txt"


      # Check whether the actual video/audio was captured.
      - name: Check captured media
        run: |
          echo "=== MEDIA FILES ==="

          find archive -type f \( \
            -name "*.mp4" -o \
            -name "*.webm" -o \
            -name "*.mkv" -o \
            -name "*.m4a" \
          \) -print

          echo "=== YT-DLP LOGS ==="

          grep -RniE "yt-dlp|YTDLP|youtube" \
            archive/logs 2>/dev/null | tail -100 || true


      # Show the complete ArchiveBox output without changing it.
      - name: Show archive
        run: |
          echo "=== ARCHIVE SIZE ==="
          du -sh archive

          echo "=== FILES ==="
          find archive -type f | sort | head -300


      # Show extractor errors for diagnosis.
      - name: Show archive errors
        run: |
          grep -RniE "ERROR|failed|yt-dlp|youtube" \
            archive/logs 2>/dev/null | tail -200 || true


      # Generate ArchiveBox's static index for the GitHub Pages viewer.
      - name: Create static ArchiveBox index
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -e BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            -e OUTPUT_PERMISSIONS="public" \
            my-archivebox \
            list --html --with-headers > archive/index.html

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -e BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            -e OUTPUT_PERMISSIONS="public" \
            my-archivebox \
            list --json --with-headers > archive/index.json




      # Upload the COMPLETE original ArchiveBox directory as a GitHub artifact.
      - name: Upload complete ArchiveBox output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/


      # Create a separate, static copy for GitHub Pages.
      # The original ArchiveBox directory remains untouched.
      - name: Prepare Pages site
        run: |
          rm -rf pages
          mkdir -p pages

          # ArchiveBox's generated viewer.
          cp archive/index.html pages/index.html
          cp archive/index.json pages/index.json

          # FIX: Change target folder copy name from snapshot back to archive
          cp -a archive/archive pages/archive

          echo "=== Pages contents ==="
          du -sh pages
          find pages -type f | head -100



      # Prepare GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # Upload ONLY the static viewing copy.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages/


      # Deploy the static ArchiveBox viewer.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
