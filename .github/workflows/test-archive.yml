name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

      - name: Run ArchiveBox (init + add URL)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Generate static site
        run: |
          set -euo pipefail
      
          rm -rf "$GITHUB_WORKSPACE/static_site"
          mkdir -p "$GITHUB_WORKSPACE/static_site"
      
          # Generate the static index.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            --entrypoint archivebox \
            my-archivebox \
            list --html --with-headers \
            > "$GITHUB_WORKSPACE/static_site/index.html"
      
          # The ArchiveBox index references files under ./archive/.
          # Copy ONLY the archive content, not the ArchiveBox runtime/data directory.
          cp -a "$GITHUB_WORKSPACE/archive/archive" \
                "$GITHUB_WORKSPACE/static_site/archive"
      
          # Remove ArchiveBox plugin/runtime artifacts recursively.
          find "$GITHUB_WORKSPACE/static_site/archive" \
            -type d -name 'ublock' \
            -prune -exec rm -rf {} +
      
          find "$GITHUB_WORKSPACE/static_site/archive" \
            -type d -name 'responses' \
            -prune -exec rm -rf {} +
      
          # Remove executable/script artifacts recursively.
          find "$GITHUB_WORKSPACE/static_site/archive" \
            -type f \( \
              -name '*.sh' -o \
              -name '*.exe' -o \
              -name '*.bin' \
            \) -delete
      
          touch "$GITHUB_WORKSPACE/static_site/.nojekyll"
      
          echo "=== Static site ==="
          find "$GITHUB_WORKSPACE/static_site" -maxdepth 3 -print
          echo "=== Size ==="
          du -sh "$GITHUB_WORKSPACE/static_site"
          
      - name: Show exported files (sample)
        run: |
          echo "Exported static files (sample):"
          find archive/output_static -maxdepth 6 -type f | sort | head -200 || true

      - name: Publish output_static to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd "$GITHUB_WORKSPACE"

          TMPDIR="$(mktemp -d)"
          cp -R archive/output_static/* "$TMPDIR"/ || true

          git fetch origin
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp -R "$TMPDIR"/* .

          # ensure .nojekyll exists to prevent Jekyll processing
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
          fi

          # final safeguard: remove any leftover runtime files before commit
          rm -rf tmp logs lib machines binaries sonic || true
          rm -f ArchiveBox.conf stdout.log || true
          find . -type f -name "*.sqlite3" -delete || true
          find . -type f -name "*.log" -delete || true
          find . -type f -name "*.lock" -delete || true
          find . -type f -name "*.pid" -delete || true
          find . -type f -name "*.sh" -delete || true
          find . -type f -name "*.exe" -delete || true
          find . -type f -name "*.bin" -delete || true
          find . -path "./**/ublock/*" -prune -exec rm -rf {} + || true
          find . -path "./**/responses/*" -prune -exec rm -rf {} + || true

          if [ ! -f index.html ]; then
            echo "Warning: no index.html found in exported static site"
          fi

          git add -A
          git commit -m "Publish ArchiveBox export to gh-pages [skip ci]" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload test output (full archive) for debugging
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
