name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .
          
      - name: Create archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            config --set SAVE_MEDIA=True

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"
        
      - name: Install WACZ
        run: |
          python3 -m pip install wacz
      
      - name: Find WARC files
        run: |
          find archive -type f \( -name "*.warc" -o -name "*.warc.gz" \) -print
      
      - name: Create WACZ
        run: |
          WARC=$(find archive -type f \( -name "*.warc" -o -name "*.warc.gz" \) | head -n 1)
          echo "Using WARC: $WARC"
          wacz create "$WARC" -o archive.wacz --detect-pages
      
      - name: Check WACZ
        run: |
          ls -lh archive.wacz

      - name: Show result
        run: |
          find archive -maxdepth 4 -type f | sort

      - name: Show media errors
        run: |
          grep -RniE "yt-dlp|youtube|media.*failed|ERROR" archive/logs archive/archive 2>/dev/null | tail -100 || true
          
      - name: List output
        run: |
          ls -lh archive.wacz
          find archive -type f | head -50
          
      - name: Find downloaded media
        run: |
          find archive -type f \( -name "*.mp4" -o -name "*.webm" -o -name "*.mkv" \) -print

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive
          path: archive.wacz
      # - name: Diagnose archive
      #   run: |
      #     du -sh archive
      #     find archive -type f | head -100
      #     echo "ERRORS:"
      #     cat archive/logs/errors.log || true
          
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
