name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:

      # Get the exact ArchiveBox fork/commit being tested.
      - name: Checkout source
        uses: actions/checkout@v4


      # Build your fork with yt-dlp installed in the image.
      - name: Build ArchiveBox image
        run: |
          docker build -t my-archivebox .


      # Re-create the temporary YouTube authentication file.
      # This file is NEVER put into archive/ or GitHub artifacts.
      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"


      # Initialize ArchiveBox and archive the requested URL.
      # yt-dlp, Node and FFmpeg are available inside the image.
      # The YouTube cookies are mounted read-only.
      - name: Create ArchiveBox archive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YTDLP_ENABLED=true \
            -e YTDLP_BINARY=yt-dlp \
            -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
            my-archivebox \
            add "${{ inputs.url }}"


      # Remove authentication credentials immediately after archiving.
      - name: Remove temporary cookies
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cookies.txt"


      # Show whether ArchiveBox actually downloaded the media.
      - name: Check captured media
        run: |
          echo "=== MEDIA FILES ==="

          find archive -type f \( \
            -name "*.mp4" -o \
            -name "*.webm" -o \
            -name "*.mkv" -o \
            -name "*.m4a" \
          \) -print

          echo "=== YT-DLP LOGS ==="

          grep -RniE "yt-dlp|YTDLP|youtube" \
            archive/logs 2>/dev/null | tail -100 || true


      # Show the original ArchiveBox output.
      - name: Show archive
        run: |
          echo "=== ARCHIVE SIZE ==="
          du -sh archive

          echo "=== FILES ==="
          find archive -type f | sort | head -300


      # Show any extractor errors without making the job fail.
      - name: Show errors
        run: |
          grep -RniE "ERROR|failed|yt-dlp|youtube" \
            archive/logs 2>/dev/null | tail -200 || true


      # Create a static ArchiveBox index for GitHub Pages.
      - name: Create ArchiveBox static index
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > archive/index.html

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > archive/index.json


      # Preserve the COMPLETE ORIGINAL ArchiveBox output.
      - name: Upload complete ArchiveBox output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/


      # Prepare GitHub Pages.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      # Publish the ArchiveBox folder as a static viewing copy.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: archive/


      # Deploy the static ArchiveBox viewer.
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
