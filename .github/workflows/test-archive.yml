name: Test Archive

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Newline-separated URLs to archive (optional). If empty, 'url' will be used."
        required: false
        type: string
      url:
        description: "Single URL (optional). Used only if 'urls' is empty."
        required: false
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Prepare URLs file for ArchiveBox
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          if [ -n "${{ inputs.urls }}" ]; then
            printf '%s\n' "${{ inputs.urls }}" > "$GITHUB_WORKSPACE/archive/urls.txt"
            echo "Wrote urls from 'urls' input to archive/urls.txt"
          elif [ -n "${{ inputs.url }}" ]; then
            printf '%s\n' "${{ inputs.url }}" > "$GITHUB_WORKSPACE/archive/urls.txt"
            echo "Wrote single url from 'url' input to archive/urls.txt"
          else
            echo "Error: no URLs provided. Set either 'urls' (multiline) or 'url'." >&2
            exit 1
          fi
          echo "URLs to archive:"
          sed -n '1,200p' "$GITHUB_WORKSPACE/archive/urls.txt" || true

           - name: Initialize collection (safely) and add URLs
        run: |
          # Detect DB files that indicate ArchiveBox is initialized
          if [ -f "$GITHUB_WORKSPACE/archive/index.sqlite3" ] || [ -f "$GITHUB_WORKSPACE/archive/db.sqlite3" ]; then
            echo "ArchiveBox DB found; skipping init."
          else
            # If the archive dir is empty, do full init + install
            if [ -z "$(ls -A "$GITHUB_WORKSPACE/archive")" ]; then
              echo "Archive dir empty → running init --install (first-time setup)"
              docker run --rm \
                -v "$GITHUB_WORKSPACE/archive:/data" \
                -w /data \
                my-archivebox \
                init --install
            else
              # Non-empty dir but no DB: run init (pick up existing files)
              echo "Archive dir contains files but no DB → running init to pick up existing collection"
              docker run --rm \
                -v "$GITHUB_WORKSPACE/archive:/data" \
                -w /data \
                my-archivebox \
                init
            fi
          fi

          # Add all URLs from the prepared urls.txt file (must exist)
          if [ ! -f "$GITHUB_WORKSPACE/archive/urls.txt" ]; then
            echo "ERROR: urls.txt not found in archive/ — make sure the Prepare URLs step wrote it" >&2
            exit 1
          fi

          echo "Adding URLs from archive/urls.txt ..."
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add /data/urls.txt

      - name: Generate static index (HTML + JSON) in output_static
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/archive:/data" my-archivebox bash -lc '
            set -euo pipefail
            mkdir -p /data/output_static
            # Create static HTML and JSON indexes per ArchiveBox docs
            archivebox list --html --with-headers > /data/output_static/index.html
            archivebox list --json --with-headers > /data/output_static/index.json
            # Prevent GitHub Pages from running Jekyll on the site root
            touch /data/output_static/.nojekyll
            # sanity
            echo "Generated:"
            ls -l /data/output_static/index.* || true
          '

      - name: Show result (sample)
        run: |
          echo "=== Sample files in archive/ (top levels) ==="
          find archive -maxdepth 2 -type d -print | sed -n '1,200p' || true
          echo "=== output_static contents ==="
          find archive/output_static -maxdepth 2 -type f -print || true

      - name: Upload static output (HTML + JSON) artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-output
          path: archive/output_static

      - name: Upload complete ArchiveBox output (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
