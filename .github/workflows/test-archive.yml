name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

# Required permissions for Pages deployment step
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

      - name: Run ArchiveBox (init + add URL)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Export static HTML for GitHub Pages (ArchiveBox recommended method)
        run: |
          # ArchiveBox v0.9.x: produce a static HTML site into /data/output_static
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            export --html --output /data/output_static

      - name: Show exported files
        run: |
          echo "Exported static files:"
          find archive/output_static -maxdepth 4 -type f | sort || true

      - name: Upload static site artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: archive/output_static

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

      # Keep the original test output artifact for debugging
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
