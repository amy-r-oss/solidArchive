name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"


      - name: Diagnose ArchiveBox yt-dlp
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YTDLP_ENABLED=true \
            -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
            my-archivebox \
            config --search yt-dlp

          echo "=== YTDLP COOKIES ==="

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YTDLP_ENABLED=true \
            -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
            my-archivebox \
            config --get YTDLP_COOKIES_FILE
      # - name: Create archive
      #   run: |
      #     mkdir -p "$GITHUB_WORKSPACE/archive"

      #     docker run --rm \
      #       -v "$GITHUB_WORKSPACE/archive:/data" \
      #       my-archivebox \
      #       init

      #     docker run --rm \
      #       -v "$GITHUB_WORKSPACE/archive:/data" \
      #       -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
      #       -e YTDLP_ENABLED=true \
      #       -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
      #       -e 'YTDLP_ARGS_EXTRA=["--remote-components=ejs:github"]' \
      #       my-archivebox \
      #       add "${{ inputs.url }}"

            
      - name: Create static ArchiveBox index
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > archive/index.html

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > archive/index.json

          ls -lh archive/index.html archive/index.json

          
      - name: Remove temporary cookies
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cookies.txt"

      - name: Check YouTube capture
        run: |
          echo "=== Media files ==="
          find archive -type f \( \
            -name "*.mp4" -o \
            -name "*.webm" -o \
            -name "*.mkv" -o \
            -name "*.m4a" \
          \) -print

          echo "=== yt-dlp / YouTube logs ==="
          grep -RniE "yt-dlp|YTDLP|youtube" archive/logs 2>/dev/null | tail -100 || true

      - name: Show result
        run: |
          echo "=== Archive size ==="
          du -sh archive

          echo "=== Archive files ==="
          find archive -maxdepth 5 -type f | sort | head -200

      - name: Show media errors
        run: |
          grep -RniE "yt-dlp|youtube|media.*failed|ERROR" \
            archive/logs archive/archive 2>/dev/null | tail -100 || true

      - name: Install WACZ
        run: |
          python3 -m pip install wacz

      - name: Find WARC files
        run: |
          find archive -type f \( -name "*.warc" -o -name "*.warc.gz" \) -print

      - name: Create WACZ
        run: |
          WARC=$(find archive -type f \( -name "*.warc" -o -name "*.warc.gz" \) | head -n 1)

          if [ -z "$WARC" ]; then
            echo "ERROR: No WARC file found"
            exit 1
          fi

          echo "Using WARC: $WARC"
          wacz create "$WARC" -o archive.wacz --detect-pages

      - name: Check WACZ
        run: |
          ls -lh archive.wacz

      - name: Upload WACZ
        uses: actions/upload-artifact@v4
        with:
          name: archive
          path: archive.wacz

      - name: Upload complete ArchiveBox output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/

          
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload ArchiveBox to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: archive/

      - name: Deploy ArchiveBox to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
