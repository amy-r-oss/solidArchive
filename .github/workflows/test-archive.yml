what is this: adityak74/google-drive-upload-git-action@v1 as if its some repo then i might need to include itThe error is happening because adityak74/google-drive-upload-git-action does not use v1 for its release version; instead, its primary version tracking tag is named main.To fix the version error immediately, change @v1 to @main.Additionally, because Google Drive uploads via pre-built marketplace actions can sometimes change or break unexpectedly, you can completely avoid third-party action errors by using standard Bash commands with rclone.Here are the two ways you can fix this:Option 1: Fix the Version String (Easiest)Simply switch the version tag from @v1 to @main:yaml- name: Upload to Google Drive
  uses: adityak74/google-drive-upload-git-action@main
  with:
    credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
    folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
    filename: 'public/**'
    overwrite: 'true'
Use code with caution.Option 2: Use rclone (Most Reliable & Bulletproof)If you want a robust configuration that won't break if a marketplace action gets deleted or updated, use rclone. It is a universally trusted command-line tool built natively into Ubuntu runners for interacting with cloud storage.This setup does not require any third-party repository actions for the upload phase:yaml- name: Upload Static Download Artifact 
  uses: actions/upload-artifact@v4 
  with: 
    name: archive-static-download-folder 
    path: public/ 
    retention-days: 90

- name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: '3.x'

- name: Install OpenTimestamps CLI
  run: |
    pip install opentimestamps-client

- name: Create OpenTimestamps for public folder
  run: |
    # This creates a matching .ots file next to every file inside public/
    ots stamp public/**/*

- name: Configure rclone & Upload to Google Drive
  env:
    GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS }}
    FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  run: |
    # 1. Write the service account JSON secret directly to a local file
    echo "$GDRIVE_JSON" > sa.json
    
    # 2. Configure rclone on the fly using environment variables
    export RCLONE_CONFIG_MYDRIVE_TYPE=drive
    export RCLONE_CONFIG_MYDRIVE_SERVICE_ACCOUNT_FILE=sa.json
    export RCLONE_CONFIG_MYDRIVE_ROOT_FOLDER_ID="$FOLDER_ID"
    
    # 3. Sync the public/ folder directly to Google Drive
    # This uploads everything recursively (originals + .ots files)
    rclone sync public/ mydrive: --verbose
