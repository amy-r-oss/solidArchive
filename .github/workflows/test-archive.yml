name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .
      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"
      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"
      - name: Exact ArchiveBox Static Export Method
        run: |
          # The exact method prescribed by the documentation for static rendering
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/index.html"
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/index.json"
      - name: Prepare Folder Structural Routing
        run: |
          # 1. Fresh start for the deployment root folder
          rm -rf "$GITHUB_WORKSPACE/public"
          mkdir -p "$GITHUB_WORKSPACE/public"
          
          # 2. Copy the main static index files into the deployment root
          cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/"
          cp "$GITHUB_WORKSPACE/archive/index.json" "$GITHUB_WORKSPACE/public/"
          
          # 3. Only copy your true snapshot data paths
          # This catches the newer user layout: archive/archive/users/...
          if [ -d "$GITHUB_WORKSPACE/archive/archive" ]; then
            echo "Copying modern multi-user data structures..."
            cp -r "$GITHUB_WORKSPACE/archive/archive" "$GITHUB_WORKSPACE/public/"
          fi
          # This catches classic numeric timestamp folders (like 1787390968.799274)
          # while ignoring system/temp/binary folders completely
          echo "Copying standalone timestamp snapshot folders..."
          find "$GITHUB_WORKSPACE/archive" -maxdepth 1 -type d -name "[0-9]*" | while read -r folder; do
            if [ -n "$folder" ]; then
              cp -r "$folder" "$GITHUB_WORKSPACE/public/"
            fi
          done
      - name: Calculate and View Real GitHub Pages URLs
        run: |
          echo "============================================="
          echo "🌐 BASE WEB HOSTING ADDRESS"
          echo "============================================="
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "Dashboard: $BASE_URL/index.html"
          echo ""
          
          echo "============================================="
          echo "🔗 LIVE ARCHIVED SNAPSHOT LINK LOCATIONS"
          echo "============================================="
          # Safer processing bypasses jq arrays by reading the output index keys directly
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json | grep -oE '"path": "[^"]+"' | sed 's/"path": "//;s/"//' | while read -r snapshot_path; do
              if [ -n "$snapshot_path" ]; then
                echo "Snapshot View URL: $BASE_URL/$snapshot_path/index.html"
                echo "Direct Video/Media Folder: $BASE_URL/$snapshot_path/"
                echo "---------------------------------------------"
              fi
            done
      - name: Upload Static Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-download-folder
          path: public/
          retention-days: 90

      - name: Upload GitHub Pages Target Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
