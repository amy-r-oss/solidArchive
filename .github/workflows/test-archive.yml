name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .
      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"
          
      # 🍪 1. GENERATE COOKIES FILE IN RUNNER ENVIRONMENT
      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YOUTUBE_DL_ARGS="--cookies /tmp/cookies.txt" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Exact ArchiveBox Static Export Method
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            config --set BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/archive"
          
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/index.html"
          
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/index.json"

      - name: Prepare Folder Structural Routing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/"
          cp "$GITHUB_WORKSPACE/archive/index.json" "$GITHUB_WORKSPACE/public/"
          
          if [ -d "$GITHUB_WORKSPACE/archive/archive" ]; then 
            cp -r "$GITHUB_WORKSPACE/archive/archive" "$GITHUB_WORKSPACE/public/"
          fi

      - name: View All Folders and Archived URLs
        run: |
          echo "============================================="
          echo "📂 DEPLOYMENT DIRECTORY STRUCTURE"
          echo "============================================="
          find "$GITHUB_WORKSPACE/public" -maxdepth 6 -type d | sort
          echo ""
          echo "================================================================="
          echo "📄 ALL UPLOADED WEB PAGES (.HTML)"
          echo "================================================================="
          cd "$GITHUB_WORKSPACE/public"
          
          find . -type f -name "*.html" | sort | while read -r file_path; do
            clean_path=$(echo "$file_path" | sed 's|^\./||')
            echo "Page: $clean_path"
            echo "Link: $BASE_URL/$clean_path"
            echo "-----------------------------------------------------------------"
          done

      - name: Show result
        run: |
          find public -maxdepth 4 -type f | sort

      # 🔐 3. OPENIMESTAMP INTEGRATION
      - name: Setup Python for OpenTimeStamp
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install OpenTimeStamp and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opentimestamps requests

      - name: Create artifact archive for OpenTimeStamp
        run: |
          cd "$GITHUB_WORKSPACE"
          tar -czf archive-${{ github.run_id }}-${{ github.run_number }}.tar.gz public/
          echo "Archive created:"
          ls -lh archive-*.tar.gz

      - name: Timestamp artifact with OpenTimeStamp
        run: |
          ARCHIVE_FILE=$(ls -t "$GITHUB_WORKSPACE"/archive-*.tar.gz | head -1)
          echo "Timestamping: $ARCHIVE_FILE"
          export ARCHIVE_FILE
          
          python << 'PYTHON_SCRIPT'
          import subprocess
          import os
          import hashlib
          import requests
          
          archive_file = os.environ.get('ARCHIVE_FILE')
          print(f"Archive file: {archive_file}")
          
          try:
              result = subprocess.run(
                  ['ots', 'stamp', archive_file],
                  capture_output=True,
                  text=True,
                  timeout=60
              )
              
              if result.returncode == 0 and os.path.exists(f"{archive_file}.ots"):
                  print(f"✅ OpenTimeStamp proof created via CLI")
                  size = os.path.getsize(f"{archive_file}.ots")
                  print(f"Proof file size: {size} bytes")
                  exit(0)
              else:
                  print(f"⚠️  CLI method failed, trying web API...")
          except FileNotFoundError:
              print("⚠️  'ots' command not found, trying web API...")
          except Exception as e:
              print(f"⚠️  CLI method error: {e}")
          
          print("Using OpenTimeStamps Web Calendar API...")
          
          with open(archive_file, 'rb') as f:
              file_data = f.read()
              file_hash = hashlib.sha256(file_data).digest()
          
          print(f"File SHA256: {file_hash.hex()}")
          
          try:
              response = requests.post(
                  'https://alice.btc.calendar.opentimestamps.org',
                  data=file_hash,
                  timeout=30
              )
              
              if response.status_code == 200:
                  with open(f"{archive_file}.ots", 'wb') as ots_file:
                      ots_file.write(response.content)
                  print("✅ OpenTimeStamp proof created via web API")
                  size = os.path.getsize(f"{archive_file}.ots")
                  print(f"Proof file size: {size} bytes")
              else:
                  print(f"⚠️  Web API returned: {response.status_code}")
          except Exception as e:
              print(f"❌ Web API error: {e}")
          
          PYTHON_SCRIPT

      - name: Verify OpenTimeStamp proof
        run: |
          ARCHIVE_FILE=$(ls -t "$GITHUB_WORKSPACE"/archive-*.tar.gz | head -1)
          export ARCHIVE_FILE
          
          if [ -f "${ARCHIVE_FILE}.ots" ]; then
            echo "✅ OTS proof file exists"
            ls -lh "${ARCHIVE_FILE}.ots"
            
            python << 'PYTHON_SCRIPT'
            import subprocess
            import os
            
            archive_file = os.environ.get('ARCHIVE_FILE')
            
            try:
                result = subprocess.run(
                    ['ots', 'verify', f"{archive_file}.ots"],
                    capture_output=True,
                    text=True,
                    timeout=30
                )
                print("Verification output:")
                print(result.stdout)
                if result.stderr:
                    print("Info/Errors:")
                    print(result.stderr)
            except Exception as e:
                print(f"⚠️  Could not verify with CLI: {e}")
                print("Note: This is expected if the timestamp hasn't been confirmed on the blockchain yet")
            PYTHON_SCRIPT
          else
            echo "⚠️  OTS proof file not found - will continue anyway"
          fi

      - name: Generate OpenTimeStamp verification report
        run: |
          ARCHIVE_FILE=$(ls -t "$GITHUB_WORKSPACE"/archive-*.tar.gz | head -1)
          
          mkdir -p "$GITHUB_WORKSPACE/ots-verification"
          
          cat > "$GITHUB_WORKSPACE/ots-verification/archive-metadata.json" << EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "url_archived": "${{ inputs.url }}",
            "timestamp": "$(date -u -Iseconds)",
            "archive_file": "$(basename $ARCHIVE_FILE)",
            "ots_proof_created": $([ -f "${ARCHIVE_FILE}.ots" ] && echo "true" || echo "false")
          }
          EOF
          
          cat "$GITHUB_WORKSPACE/ots-verification/archive-metadata.json"

      - name: Setup Google Drive authentication
        env:
          GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        run: |
          mkdir -p "$HOME/.config/gdown"
          echo "$GOOGLE_DRIVE_CREDENTIALS" > "$HOME/.config/gdown/credentials.json"
          pip install --quiet google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Upload artifacts to Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os
          import glob
          import time
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          
          creds_path = os.path.expanduser("~/.config/gdown/credentials.json")
          SCOPES = ['https://www.googleapis.com/auth/drive']
          
          try:
              credentials = Credentials.from_service_account_file(creds_path, scopes=SCOPES)
              drive_service = build('drive', 'v3', credentials=credentials)
          except Exception as e:
              print(f"❌ Failed to authenticate: {e}")
              exit(1)
          
          folder_id = os.getenv('GOOGLE_DRIVE_FOLDER_ID')
          if not folder_id:
              print("❌ GOOGLE_DRIVE_FOLDER_ID secret not set")
              exit(1)
          
          run_folder_name = f"archive-run-{os.getenv('GITHUB_RUN_ID')}-{os.getenv('GITHUB_RUN_NUMBER')}"
          
          folder_metadata = {
              'name': run_folder_name,
              'mimeType': 'application/vnd.google-apps.folder',
              'parents': [folder_id]
          }
          
          try:
              folder = drive_service.files().create(body=folder_metadata, fields='id').execute()
              run_folder_id = folder.get('id')
              print(f"✅ Created Google Drive folder: {run_folder_id}")
          except Exception as e:
              print(f"❌ Failed to create folder: {e}")
              exit(1)
          
          workspace = os.getenv('GITHUB_WORKSPACE')
          files_to_upload = []
          
          # Only archive files and OTS proofs - NOT the entire public/ folder
          archive_files = glob.glob(os.path.join(workspace, 'archive-*.tar.gz'))
          for f in archive_files:
              files_to_upload.append((f, 'Archive Artifact (.tar.gz)'))
          
          ots_files = glob.glob(os.path.join(workspace, 'archive-*.tar.gz.ots'))
          for f in ots_files:
              files_to_upload.append((f, 'OpenTimeStamp Proof (.ots)'))
          
          metadata_path = os.path.join(workspace, 'ots-verification', 'archive-metadata.json')
          if os.path.exists(metadata_path):
              files_to_upload.append((metadata_path, 'Archive Metadata'))
          
          if not files_to_upload:
              print("❌ No files found to upload")
              exit(1)
          
          uploaded_count = 0
          for file_path, description in files_to_upload:
              if os.path.isfile(file_path):
                  file_name = os.path.basename(file_path)
                  file_size = os.path.getsize(file_path)
                  
                  print(f"\n📤 Uploading: {file_name} ({file_size / (1024*1024):.2f} MB)")
                  
                  file_metadata = {
                      'name': file_name,
                      'parents': [run_folder_id],
                      'description': description
                  }
                  
                  media = MediaFileUpload(file_path, resumable=True)
                  request = drive_service.files().create(
                      body=file_metadata,
                      media_body=media,
                      fields='id, webViewLink',
                      supportsAllDrives=True
                  )
                  
                  response = None
                  retry_count = 0
                  while response is None and retry_count < 3:
                      try:
                          status, response = request.next_chunk()
                          if status:
                              print(f"  Progress: {int(status.progress() * 100)}%")
                      except Exception as e:
                          retry_count += 1
                          print(f"  Retry {retry_count}/3")
                          time.sleep(5)
                  
                  if response:
                      file_url = response.get('webViewLink')
                      print(f"  ✅ Uploaded: {file_url}")
                      uploaded_count += 1
          
          if uploaded_count > 0:
              drive_url = f"https://drive.google.com/drive/folders/{run_folder_id}"
              print(f"\n✅ Successfully uploaded {uploaded_count} file(s)")
              print(f"📁 Google Drive folder: {drive_url}")
          
          PYTHON_SCRIPT

      - name: Upload Static Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-download-folder
          path: public/
          retention-days: 90

      - name: Upload OpenTimeStamp files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-ots-proof
          path: |
            archive-*.tar.gz
            archive-*.tar.gz.ots
            ots-verification/
          retention-days: 90

      - name: Upload GitHub Pages Target Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
