name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .
      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"
          
      # 🍪 1. GENERATE COOKIES FILE IN RUNNER ENVIRONMENT
      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install
          # 🐳 2. PASS COOKIES TO DOCKER CONTAINER
          # -v mounts the file into a temporary data path inside the docker sandbox
          # -e tells ArchiveBox's yt-dlp config exactly where to look for those cookies
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
            -e YOUTUBE_DL_ARGS="--cookies /tmp/cookies.txt" \
            my-archivebox \
            add "${{ inputs.url }}"
      - name: Exact ArchiveBox Static Export Method
        run: |
          # Set BASE_URL before exporting
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            config --set BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/archive"
          
          # 1. Generate the indexes into the workspace root so paths align correctly
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/index.html"
          
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/index.json"

      - name: Prepare Folder Structural Routing
        run: |
          # 1. Clean and create the public deployment directory
          rm -rf "$GITHUB_WORKSPACE/public"
          mkdir -p "$GITHUB_WORKSPACE/public/archive"
          
          # 2. Move the root indexes into public
          mv "$GITHUB_WORKSPACE/index.html" "$GITHUB_WORKSPACE/public/"
          mv "$GITHUB_WORKSPACE/index.json" "$GITHUB_WORKSPACE/public/"
          
          # 3. ONLY copy the actual snapshots, skipping deep logs, extensions, and crawls
          # This drastically reduces the path depth and file sizes
          if [ -d "$GITHUB_WORKSPACE/archive/users/system/snapshots" ]; then
            cp -r "$GITHUB_WORKSPACE/archive/users/system/snapshots" "$GITHUB_WORKSPACE/public/archive/"
          fi

          # 4. CRITICAL CLEANUP: Remove deeply nested browser extension folders/captchas
          # that break GitHub's file systems, while keeping the web assets intact
          find "$GITHUB_WORKSPACE/public/archive" -type d -name "responses" -exec rm -rf {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE/public/archive" -type d -name "crawls" -exec rm -rf {} + 2>/dev/null || true

          # 5. Disable Jekyll processing
          touch "$GITHUB_WORKSPACE/public/.nojekyll"

      - name: View All Folders and Archived URLs
        run: |
          echo "============================================="
          echo "📂 DEPLOYMENT DIRECTORY STRUCTURE"
          echo "============================================="
          # Lists folders up to 6 levels down to expose deep snapshot assets
          find "$GITHUB_WORKSPACE/public" -maxdepth 6 -type d | sort
          echo ""
          echo "================================================================="
          echo "📄 ALL UPLOADED WEB PAGES (.HTML)"
          echo "================================================================="
          cd "$GITHUB_WORKSPACE/public"
          
          # Find only files that end with the .html extension
          find . -type f -name "*.html" | sort | while read -r file_path; do
            # Remove the leading './' from the file path
            clean_path=$(echo "$file_path" | sed 's|^\./||')
            
            # Combine the base URL with the clean file path
            echo "Page: $clean_path"
            echo "Link: $BASE_URL/$clean_path"
            echo "-----------------------------------------------------------------"
          done
        # echo "============================================="
        # echo "🔗 ALL ARCHIVED URLS IN DATABASE"
        # echo "============================================="
        # # Replaced broken status argument with valid base command
        # docker run --rm \
        #   -v "$GITHUB_WORKSPACE/archive:/data" \
        #   my-archivebox \
        #   list
      - name: Show result
        run: |
          find public -maxdepth 4 -type f | sort
      - name: Upload Static Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-download-folder
          path: public/
          retention-days: 90

      - name: Upload GitHub Pages Target Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
