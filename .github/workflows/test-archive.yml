name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Exact ArchiveBox Static Export Method
        run: |
          # 1. Use the generic list command to output the root navigation files
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/index.html"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/index.json"

      - name: Prepare Folder Structural Routing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          
          # Move base indexes compiled using the exact method
          cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/"
          cp "$GITHUB_WORKSPACE/archive/index.json" "$GITHUB_WORKSPACE/public/"
          
          # Sync absolutely everything (including loose numeric timestamp folders)
          # while ignoring lockfiles or system databases
          rsync -av \
            --exclude='logs/' \
            "$GITHUB_WORKSPACE/archive/" "$GITHUB_WORKSPACE/public/"
        # --exclude='*.sqlite3*' \
        # --exclude='sources/' \

      - name: View All Folders and Archived URLs
        run: |
          echo "============================================="
          echo "📂 DEPLOYMENT DIRECTORY STRUCTURE"
          echo "============================================="
          find "$GITHUB_WORKSPACE/public" -maxdepth 6 -type d | sort

          echo ""
          echo "============================================="
          echo "🔗 ALL ARCHIVED URLS IN DATABASE"
          echo "============================================="
          # Fixed syntax: loops over the JSON array to extract plain URLs cleanly
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json | jq -r '.[] | .url'

      - name: Show result
        run: |
          find public -maxdepth 4 -type f | sort

      - name: Upload Static Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-download-folder
          path: public/
          retention-days: 90

      - name: Upload GitHub Pages Target Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
