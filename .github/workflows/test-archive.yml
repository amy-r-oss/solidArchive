name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Install WACZerciser
        run: |
          python3 -m pip install waczerciser

      - name: Create WACZ
        run: |
          waczerciser create archive archive.wacz --as-files

      - name: Show result
        run: |
          find archive -maxdepth 4 -type f | sort
          
      - name: List output
        run: |
          ls -lh archive.wacz
          find archive -type f | head -50

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive
          path: archive.wacz
      # - name: Diagnose archive
      #   run: |
      #     du -sh archive
      #     find archive -type f | head -100
      #     echo "ERRORS:"
      #     cat archive/logs/errors.log || true
          
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
