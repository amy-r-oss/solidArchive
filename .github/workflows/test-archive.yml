name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Export as Static HTML (Official Method for GitHub Pages)
        run: |
          # Official ArchiveBox method for static export to GitHub Pages
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            export --html /data/static-export

      - name: Generate Index Files
        run: |
          # Generate HTML and JSON indexes for browsing
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/index.html"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/index.json"

      - name: Prepare Folder Structure for GitHub Pages
        run: |
          # 1. Fresh start for the deployment root folder
          rm -rf "$GITHUB_WORKSPACE/public"
          mkdir -p "$GITHUB_WORKSPACE/public"
          
          # 2. Copy exported static HTML content
          if [ -d "$GITHUB_WORKSPACE/archive/static-export" ]; then
            echo "✅ Copying static HTML export..."
            cp -r "$GITHUB_WORKSPACE/archive/static-export"/* "$GITHUB_WORKSPACE/public/"
          fi
          
          # 3. Copy the index files
          cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/index-archive.html" || true
          cp "$GITHUB_WORKSPACE/archive/index.json" "$GITHUB_WORKSPACE/public/index-archive.json" || true
          
          # 4. Copy archive data (modern multi-user layout)
          if [ -d "$GITHUB_WORKSPACE/archive/archive" ]; then
            echo "✅ Copying archive snapshot data..."
            cp -r "$GITHUB_WORKSPACE/archive/archive" "$GITHUB_WORKSPACE/public/"
          fi

          # 5. List what we're deploying
          echo ""
          echo "📦 Files ready for GitHub Pages deployment:"
          find "$GITHUB_WORKSPACE/public" -type f -name "index.html" | head -5
          echo "..."
          echo "Total files: $(find $GITHUB_WORKSPACE/public -type f | wc -l)"

      - name: Calculate and Display GitHub Pages URLs
        run: |
          echo "============================================="
          echo "🌐 BASE WEB HOSTING ADDRESS"
          echo "============================================="
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "📍 Main Dashboard: $BASE_URL/index.html"
          echo ""
          
          echo "============================================="
          echo "✅ DEPLOYMENT COMPLETE - Your archive is ready!"
          echo "============================================="
          echo "Access your archive at: $BASE_URL"

      - name: Upload Static Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-export
          path: public/
          retention-days: 90

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
