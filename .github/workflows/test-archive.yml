name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Exact ArchiveBox Static Export Method
        run: |
          # The exact method prescribed by the documentation for static rendering
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/index.html"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/index.json"

      - name: Prepare Folder Structural Routing
        run: |
          # 1. Clear old targets and place index files in the root
          cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/"
          cp "$GITHUB_WORKSPACE/archive/index.json" "$GITHUB_WORKSPACE/public/"
          
          # 2. Sync everything recursively using rsync.
          # This captures all nested users directories AND random numeric timestamp folders.
          rsync -av \
            --exclude='*.sqlite3*' \
            --exclude='logs/' \
            --exclude='sources/' \
            "$GITHUB_WORKSPACE/archive/" "$GITHUB_WORKSPACE/public/"

      - name: Calculate and View Real GitHub Pages URLs
        run: |
          echo "============================================="
          echo "🌐 BASE WEB HOSTING ADDRESS"
          echo "============================================="
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "Dashboard: $BASE_URL/index.html"
          echo ""
          
          echo "============================================="
          echo "🔗 LIVE ARCHIVED SNAPSHOT LINK LOCATIONS"
          echo "============================================="
          # Safer processing bypasses jq arrays by reading the output index keys directly
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json | grep -oE '"path": "[^"]+"' | sed 's/"path": "//;s/"//' | while read -r snapshot_path; do
              if [ -n "$snapshot_path" ]; then
                echo "Snapshot View URL: $BASE_URL/$snapshot_path/index.html"
                echo "Direct Video/Media Folder: $BASE_URL/$snapshot_path/"
                echo "---------------------------------------------"
              fi
            done

      - name: Upload Static Download Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-download-folder
          path: public/
          retention-days: 90

      - name: Upload GitHub Pages Target Build
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
