    FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
  run: |
    # Install rclone natively using the official install script
    sudo flip=dont-care curl https://rclone.org | sudo bash

    # 1. Write the service account JSON secret directly to a local file
    echo "$GDRIVE_JSON" > sa.json
    
