  run: |
    # Use find to locate only files (-type f) and pass them to ots stamp
    find public/ -type f -exec ots stamp {} +
Use code with caution.How this resolves the errorfind public/ -type f: Recursively searches the entire ArchiveBox public/ directory and filters for standard files, completely ignoring directories like public/archive/1788142369.25948.-exec ots stamp {} +: Bunches those file paths together and passes them directly to the ots stamp command efficiently, creating a .ots counterpart for every archived file.Are you running into any other issues with large file sizes or rate limits from Google Drive while uploading your ArchiveBox data?AI can make mistakes, so double-check responses no doing only files isnt great how about we zip the folder and then give to ots would that work?Yes, zipping the folder and timestamping the single .zip archive is an excellent idea.In fact, for ArchiveBox, this is a much better approach. It prevents the OpenTimestamps CLI from overwhelming calendar servers with hundreds of individual file requests, and it makes uploading to Google Drive significantly faster since transferring one large file is much more efficient than transferring thousands of tiny metadata files.Here is the updated, complete workflow that handles zipping, timestamping, and uploading:Updated Workflowyaml- name: Upload Static Download Artifact 
