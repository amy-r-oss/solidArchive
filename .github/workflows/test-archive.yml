name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  archive:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          mkdir -p "$GITHUB_WORKSPACE/public"

      - name: Run ArchiveBox
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Generate Static Index (Official Method for GitHub Pages)
        run: |
          # Official ArchiveBox method for static HTML generation
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            generate-static-index

      - name: Generate List Indexes
        run: |
          # Generate HTML and JSON list views for browsing
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > "$GITHUB_WORKSPACE/archive/list.html"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > "$GITHUB_WORKSPACE/archive/list.json"

      - name: Prepare Folder Structure for GitHub Pages
        run: |
          # 1. Fresh start for the deployment root folder
          rm -rf "$GITHUB_WORKSPACE/public"
          mkdir -p "$GITHUB_WORKSPACE/public"
          
          # 2. Copy generated static index files
          if [ -f "$GITHUB_WORKSPACE/archive/index.html" ]; then
            echo "✅ Copying generated static index..."
            cp "$GITHUB_WORKSPACE/archive/index.html" "$GITHUB_WORKSPACE/public/"
          fi
          
          # 3. Copy list views
          cp "$GITHUB_WORKSPACE/archive/list.html" "$GITHUB_WORKSPACE/public/" || true
          cp "$GITHUB_WORKSPACE/archive/list.json" "$GITHUB_WORKSPACE/public/" || true
          
          # 4. Copy archive data (snapshots and extracted content)
          if [ -d "$GITHUB_WORKSPACE/archive/archive" ]; then
            echo "✅ Copying archive snapshot data..."
            cp -r "$GITHUB_WORKSPACE/archive/archive" "$GITHUB_WORKSPACE/public/"
          fi

          # 5. Copy any web directory data
          if [ -d "$GITHUB_WORKSPACE/archive/web" ]; then
            echo "✅ Copying web snapshot data..."
            cp -r "$GITHUB_WORKSPACE/archive/web" "$GITHUB_WORKSPACE/public/"
          fi

          # 6. List what we're deploying
          echo ""
          echo "📦 Files ready for GitHub Pages deployment:"
          find "$GITHUB_WORKSPACE/public" -type f | head -10
          echo "..."
          echo "Total files: $(find $GITHUB_WORKSPACE/public -type f | wc -l)"

      - name: Display GitHub Pages URLs
        run: |
          echo "============================================="
          echo "✅ ARCHIVE READY FOR GITHUB PAGES"
          echo "============================================="
          BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          echo "📍 Your archive will be available at:"
          echo "   $BASE_URL/index.html"
          echo ""
          echo "📄 Browse all links:"
          echo "   $BASE_URL/list.html"

      - name: Upload Static Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-static-export
          path: public/
          retention-days: 90

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
