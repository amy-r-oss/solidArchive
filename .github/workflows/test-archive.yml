name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"
          # ensure output dir exists on host so container mount has it
          mkdir -p "$GITHUB_WORKSPACE/archive/output_static"

      - name: Run ArchiveBox (init + add URL)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Generate static site inside container (no rsync here)
        run: |
          # run ArchiveBox inside container to produce index or static export into /data/output_static
          docker run --rm -v "$GITHUB_WORKSPACE/archive:/data" my-archivebox bash -lc "
            set -euo pipefail
            mkdir -p /data/output_static

            if archivebox --help | grep -q \"export\"; then
              echo 'Using archivebox export --html --output'
              archivebox export --html --output /data/output_static || true
              touch /data/output_static/.nojekyll || true
              exit 0
            fi

            if archivebox --help | grep -q \"static\"; then
              echo 'Using archivebox static --output'
              archivebox static --output /data/output_static || true
              touch /data/output_static/.nojekyll || true
              exit 0
            fi

            echo 'Falling back to list --html method'
            archivebox list --html --with-headers > /data/output_static/index.html || true
            touch /data/output_static/.nojekyll || true
          "

      - name: Mirror collection into output_static (host-side) and clean runtime files
        run: |
          set -euo pipefail

          SRC="$GITHUB_WORKSPACE/archive/"
          DST="$GITHUB_WORKSPACE/archive/output_static/"

          # Use rsync on the runner side (avoid container-side rsync/permission issues).
          # Exclude runtime and large/install directories that break Pages packaging.
          rsync -a --delete \
            --exclude='output_static' \
            --exclude='*.sqlite3' \
            --exclude='tmp' \
            --exclude='tmp/**' \
            --exclude='logs' \
            --exclude='logs/**' \
            --exclude='lib' \
            --exclude='lib/**' \
            --exclude='machines' \
            --exclude='machines/**' \
            --exclude='sonic' \
            --exclude='sonic/**' \
            --exclude='binaries' \
            --exclude='binaries/**' \
            --exclude='ArchiveBox.conf' \
            --exclude='stdout.log' \
            --exclude='*.log' \
            --exclude='*.lock' \
            --exclude='*.pid' \
            \"$SRC\" \"$DST\"

          # Aggressive cleanup: ensure nothing runtime-like remains
          rm -rf "$DST/tmp" "$DST/logs" "$DST/lib" "$DST/machines" "$DST/binaries" "$DST/sonic" || true
          find "$DST" -type f -name "*.sqlite3" -delete || true
          find "$DST" -type f -name "*.log" -delete || true
          find "$DST" -type f -name "*.lock" -delete || true
          find "$DST" -type f -name "*.pid" -delete || true
          rm -f "$DST/ArchiveBox.conf" "$DST/stdout.log" || true

          # ensure .nojekyll present
          touch "$DST/.nojekyll"

          echo "Assembled static site at $DST (sample):"
          find "$DST" -maxdepth 3 -type f | head -200 || true
          du -sh "$DST" || true

      - name: Show exported files (sample)
        run: |
          echo "Exported static files (sample):"
          find archive/output_static -maxdepth 6 -type f | sort | head -200 || true

      - name: Publish output_static to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd "$GITHUB_WORKSPACE"

          TMPDIR="$(mktemp -d)"
          cp -R archive/output_static/* "$TMPDIR"/ || true

          git fetch origin
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp -R "$TMPDIR"/* .

          # ensure .nojekyll exists to prevent Jekyll processing
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
          fi

          # final safeguard: remove any leftover runtime files before commit
          find . -type d -name lib -prune -exec rm -rf {} + || true
          find . -type d -name machines -prune -exec rm -rf {} + || true
          find . -type d -name sonic -prune -exec rm -rf {} + || true
          find . -type d -name binaries -prune -exec rm -rf {} + || true
          rm -rf tmp logs || true
          rm -f ArchiveBox.conf stdout.log || true
          find . -type f -name "*.sqlite3" -delete || true
          find . -type f -name "*.log" -delete || true
          find . -type f -name "*.lock" -delete || true
          find . -type f -name "*.pid" -delete || true

          if [ ! -f index.html ]; then
            echo "Warning: no index.html found in exported static site"
          fi

          git add -A
          git commit -m "Publish ArchiveBox export to gh-pages [skip ci]" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload test output (full archive) for debugging
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
