name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this exact fork/commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build ArchiveBox from this source
        run: |
          docker build -t my-archivebox .

      - name: Create archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

      - name: Run ArchiveBox (init + add URL)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            add "${{ inputs.url }}"

      - name: Generate static site (detect export/static; fallback to list --html) and clean runtime files
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/archive:/data" my-archivebox bash -lc '
            set -euo pipefail

            mkdir -p /data/output_static

            # Prefer new export CLI if present
            if archivebox --help | grep -q "\bexport\b"; then
              echo "Using archivebox export --html --output"
              archivebox export --html --output /data/output_static
              touch /data/output_static/.nojekyll
              exit 0
            fi

            # Fall back to `static` if present
            if archivebox --help | grep -q "\bstatic\b"; then
              echo "Using archivebox static --output"
              archivebox static --output /data/output_static
              touch /data/output_static/.nojekyll
              exit 0
            fi

            # Final fallback: generate a static index with list --html and mirror files
            echo "Falling back to list --html method"
            archivebox list --html --with-headers > /data/output_static/index.html

            # Mirror collection files into output_static so links resolve.
            # Exclude known runtime or large paths that must not be published.
            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete \
                --exclude=output_static \
                --exclude=db.sqlite3 \
                --exclude=index.sqlite3 \
                --exclude='*.sqlite3' \
                --exclude=tmp \
                --exclude=tmp/** \
                --exclude=logs \
                --exclude=logs/** \
                --exclude=lib \
                --exclude=lib/** \
                --exclude=machines \
                --exclude=machines/** \
                --exclude=binaries \
                --exclude=binaries/** \
                --exclude='**/*.lock' \
                --exclude='**/*.pid' \
                --exclude='archivebox.log' \
                /data/ /data/output_static/
            else
              for p in /data/*; do
                [ "$p" = "/data/output_static" ] && continue
                case "$(basename "$p")" in
                  db.sqlite3|index.sqlite3|*.sqlite3|tmp|logs|lib|machines|binaries|archivebox.log) continue ;;
                esac
                cp -a "$p" /data/output_static/ || true
              done
            fi

            # remove any leftover runtime files/directories that could break packaging
            rm -rf /data/output_static/tmp /data/output_static/logs /data/output_static/lib /data/output_static/machines /data/output_static/binaries || true
            find /data/output_static -type f -name "*.sqlite3" -exec rm -f {} + || true
            find /data/output_static -type f -name "*.lock" -exec rm -f {} + || true
            find /data/output_static -type f -name "*.pid" -exec rm -f {} + || true

            # disable Jekyll processing on GitHub Pages
            touch /data/output_static/.nojekyll

            if [ ! -f /data/output_static/index.html ]; then
              echo "ERROR: index.html not generated"
              exit 2
            fi

            echo "Static site assembled and cleaned at /data/output_static"
            du -sh /data/output_static || true
          '

      - name: Show exported files (sample)
        run: |
          echo "Exported static files (sample):"
          find archive/output_static -maxdepth 6 -type f | sort | head -200 || true

      - name: Publish output_static to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          cd "$GITHUB_WORKSPACE"

          TMPDIR="$(mktemp -d)"
          cp -R archive/output_static/* "$TMPDIR"/ || true

          git fetch origin
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp -R "$TMPDIR"/* .

          # ensure .nojekyll exists to prevent Jekyll processing
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
          fi

          # final safeguard: remove any leftover runtime files before commit
          rm -rf tmp logs lib machines binaries || true
          find . -type f -name "*.sqlite3" -delete || true
          find . -type f -name "*.lock" -delete || true
          find . -type f -name "*.pid" -delete || true

          if [ ! -f index.html ]; then
            echo "Warning: no index.html found in exported static site"
          fi

          git add -A
          git commit -m "Publish ArchiveBox export to gh-pages [skip ci]" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload test output (full archive) for debugging
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
