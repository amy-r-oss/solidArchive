name: Test Archive

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "One or more URLs to archive (separate by newline or comma)"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build ArchiveBox Docker image
        run: |
          docker build -t my-archivebox .

      - name: Prepare archive directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

      - name: Initialize ArchiveBox collection
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            archivebox init --install

      - name: Archive each URL (supports newline- or comma-separated input)
        run: |
          set -euo pipefail
          # normalize the input into one URL per line
          echo "Input URLs:"
          echo "${{ inputs.urls }}"
          printf "%s\n" "${{ inputs.urls }}" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' > "$RUNNER_TEMP/urls.txt"

          echo "Archiving URLs from $RUNNER_TEMP/urls.txt"
          while IFS= read -r url; do
            echo "-> archiving: $url"
            docker run --rm \
              -v "$GITHUB_WORKSPACE/archive:/data" \
              my-archivebox \
              archivebox add "$url" || echo "Warning: add failed for $url"
          done < "$RUNNER_TEMP/urls.txt"
          rm -f "$RUNNER_TEMP/urls.txt" || true

      - name: Generate static index.html (ArchiveBox list --html)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive/output_static"
          # get a static index from ArchiveBox; redirect container stdout to host file
          docker run --rm -v "$GITHUB_WORKSPACE/archive:/data" my-archivebox archivebox list --html --with-headers > "$GITHUB_WORKSPACE/archive/output_static/index.html" || (echo "Failed to generate index.html"; exit 1)
          # ensure .nojekyll so GitHub Pages won't run Jekyll
          touch "$GITHUB_WORKSPACE/archive/output_static/.nojekyll"

      - name: Fix ownership so runner can copy/modify container-created files
        run: |
          # make the runner user own archive/ so subsequent rsync/git can operate
          sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE/archive" || true
          sudo find "$GITHUB_WORKSPACE/archive" -type d -exec chmod 0755 {} + || true
          sudo find "$GITHUB_WORKSPACE/archive" -type f -exec chmod 0644 {} + || true

      - name: Mirror collection into output_static (exclude runtime and large files)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/archive/output_static"
          # Use rsync to copy files while excluding known runtime/large/transient paths and file types
          rsync -a --delete \
            --exclude=output_static \
            --exclude=db.sqlite3 \
            --exclude=index.sqlite3 \
            --exclude='*.sqlite3' \
            --exclude=tmp --exclude=tmp/** \
            --exclude=logs --exclude=logs/** \
            --exclude=lib --exclude=lib/** \
            --exclude=machines --exclude=machines/** \
            --exclude=sonic --exclude=sonic/** \
            --exclude=binaries --exclude=binaries/** \
            --exclude=ArchiveBox.conf \
            --exclude=stdout.log \
            --exclude='*.log' \
            --exclude='*.lock' \
            --exclude='*.pid' \
            --exclude='**/ublock' --exclude='**/ublock/**' \
            --exclude='**/responses' --exclude='**/responses/**' \
            --exclude='**/*.sh' --exclude='**/*.exe' --exclude='**/*.bin' \
            "$GITHUB_WORKSPACE/archive/" "$GITHUB_WORKSPACE/archive/output_static/"

      - name: Cleanup leftover runtime files from output_static
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/tmp" || true
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/logs" || true
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/lib" || true
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/machines" || true
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/binaries" || true
          rm -rf "$GITHUB_WORKSPACE/archive/output_static/sonic" || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.sqlite3" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.log" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.lock" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.pid" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.sh" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.exe" -delete || true
          find "$GITHUB_WORKSPACE/archive/output_static" -type f -name "*.bin" -delete || true
          rm -f "$GITHUB_WORKSPACE/archive/output_static/ArchiveBox.conf" "$GITHUB_WORKSPACE/archive/output_static/stdout.log" || true
          # final safety
          touch "$GITHUB_WORKSPACE/archive/output_static/.nojekyll"

      - name: Show exported files (sample)
        run: |
          echo "Index preview:"
          head -n 50 "$GITHUB_WORKSPACE/archive/output_static/index.html" || true
          echo "Files in output_static (top):"
          find "$GITHUB_WORKSPACE/archive/output_static" -maxdepth 3 -type f | sort | head -200 || true

      - name: Publish output_static to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          TMPDIR="$(mktemp -d)"
          cp -R archive/output_static/* "$TMPDIR"/ || true

          git fetch origin
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          cp -R "$TMPDIR"/* .
          if [ ! -f .nojekyll ]; then
            touch .nojekyll
          fi

          # extra safeguards
          rm -rf tmp logs lib machines binaries sonic || true
          rm -f ArchiveBox.conf stdout.log || true
          find . -type f -name "*.sqlite3" -delete || true
          find . -type f -name "*.log" -delete || true
          find . -type f -name "*.lock" -delete || true
          find . -type f -name "*.pid" -delete || true
          find . -type f -name "*.sh" -delete || true
          find . -type f -name "*.exe" -delete || true
          find . -type f -name "*.bin" -delete || true
          find . -path "./**/ublock/*" -prune -exec rm -rf {} + || true
          find . -path "./**/responses/*" -prune -exec rm -rf {} + || true

          git add -A
          git commit -m "Publish ArchiveBox export to gh-pages [skip ci]" || true
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Upload complete ArchiveBox output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/
