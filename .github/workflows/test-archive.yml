name: Test Archive

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL to archive"
        required: true
        type: string

jobs:
  archive:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 1. Checkout ArchiveBox source
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. Build ArchiveBox image
      # ============================================================
      - name: Build ArchiveBox image
        run: |
          docker build -t my-archivebox .


      # ============================================================
      # 3. Create temporary YouTube cookies
      # ============================================================
      - name: Create temporary YouTube cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/cookies.txt"
          chmod 600 "$RUNNER_TEMP/cookies.txt"


      # ============================================================
      # 4. Initialize ArchiveBox
      # ============================================================
      - name: Initialize and install ArchiveBox
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archive"

          docker run --rm \
            --init \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            init --install


      # ============================================================
      # 5. Archive URL
      #
      # Automatically retries if ArchiveBox/abxbus gets stuck
      # during ProcessKillEvent shutdown.
      # ============================================================
      - name: Archive URL
        env:
          ARCHIVE_URL: ${{ inputs.url }}
        run: |
          set +e

          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do

            echo
            echo "============================================================"
            echo " ArchiveBox attempt $ATTEMPT / $MAX_ATTEMPTS"
            echo "============================================================"
            echo

            CONTAINER_NAME="archivebox-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ATTEMPT}"

            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            timeout --signal=TERM --kill-after=15s 30m \
              docker run \
                --name "$CONTAINER_NAME" \
                --init \
                -v "$GITHUB_WORKSPACE/archive:/data" \
                -v "$RUNNER_TEMP/cookies.txt:/tmp/cookies.txt:ro" \
                -e YTDLP_ENABLED=true \
                -e YTDLP_BINARY=yt-dlp \
                -e YTDLP_COOKIES_FILE=/tmp/cookies.txt \
                my-archivebox \
                add "$ARCHIVE_URL"

            EXIT_CODE=$?

            echo
            echo "ArchiveBox exit code: $EXIT_CODE"

            if [ "$EXIT_CODE" -eq 0 ]; then

              echo
              echo "ArchiveBox completed successfully."
              echo

              docker rm "$CONTAINER_NAME" >/dev/null 2>&1 || true

              exit 0
            fi

            echo
            echo "WARNING: ArchiveBox attempt $ATTEMPT failed."
            echo "Cleaning up container..."
            echo

            docker stop -t 5 "$CONTAINER_NAME" \
              >/dev/null 2>&1 || true

            docker rm -f "$CONTAINER_NAME" \
              >/dev/null 2>&1 || true

            sleep 3

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying with a fresh ArchiveBox container..."
              sleep 5
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo
          echo "ArchiveBox failed after $MAX_ATTEMPTS attempts."
          exit 1


      # ============================================================
      # 6. Remove YouTube credentials
      # ============================================================
      - name: Remove temporary cookies
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cookies.txt"


      # ============================================================
      # 7. Show EXACT runner filesystem
      # ============================================================
      - name: Inspect ArchiveBox filesystem
        run: |
          echo "============================================================"
          echo " WORKSPACE"
          echo "============================================================"

          pwd

          echo
          echo "============================================================"
          echo " archive/ ROOT"
          echo "============================================================"

          ls -la archive || true

          echo
          echo "============================================================"
          echo " DIRECTORIES UNDER archive/"
          echo "============================================================"

          find archive \
            -maxdepth 4 \
            -type d \
            -print \
            | sort \
            | head -300

          echo
          echo "============================================================"
          echo " POSSIBLE SNAPSHOT DIRECTORIES"
          echo "============================================================"

          find archive \
            -type d \
            \( \
              -name "snapshots" -o \
              -name "users" -o \
              -name "crawls" \
            \) \
            -print \
            | sort

          echo
          echo "============================================================"
          echo " FILE COUNT"
          echo "============================================================"

          find archive -type f | wc -l


      # ============================================================
      # 8. Check captured media
      # ============================================================
      - name: Check captured media
        run: |
          echo "=== MEDIA FILES ==="

          find archive -type f \( \
            -name "*.mp4" -o \
            -name "*.webm" -o \
            -name "*.mkv" -o \
            -name "*.m4a" \
          \) -print

          echo
          echo "=== MEDIA COUNT ==="

          MEDIA_COUNT=$(find archive -type f \( \
            -name "*.mp4" -o \
            -name "*.webm" -o \
            -name "*.mkv" -o \
            -name "*.m4a" \
          \) | wc -l)

          echo "Captured media files: $MEDIA_COUNT"

          echo
          echo "=== YT-DLP LOGS ==="

          grep -RniE "yt-dlp|YTDLP|youtube" \
            archive/logs 2>/dev/null \
            | tail -100 || true


      # ============================================================
      # 9. Show archive files/errors
      # ============================================================
      - name: Show archive errors
        run: |
          echo "=== ARCHIVE SIZE ==="
          du -sh archive

          echo
          echo "=== EXTRACTOR ERRORS ==="

          grep -RniE "ERROR|failed|yt-dlp|youtube" \
            archive/logs 2>/dev/null \
            | tail -200 || true


      # ============================================================
      # 10. Generate ArchiveBox static index
      #
      # This is the documented ArchiveBox static export method.
      #
      # The generated index is placed next to the ArchiveBox
      # archive/ directory.
      # ============================================================
      - name: Create static ArchiveBox index
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > archive/index.html

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > archive/index.json


      # ============================================================
      # 11. DIAGNOSTIC:
      # Check EXACT links generated by ArchiveBox
      #
      # This is the important new diagnostic block.
      #
      # We want to know whether ArchiveBox generated:
      #
      #   snap-xxxx.archivebox.localhost
      #
      # or a relative static path such as:
      #
      #   archive/...
      #
      # Do NOT modify the links here.
      # ============================================================
      - name: Check generated snapshot links
        run: |
          echo "============================================================"
          echo " ARCHIVEBOX VERSION"
          echo "============================================================"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            version

          echo
          echo "============================================================"
          echo " GENERATED SNAPSHOT LINKS"
          echo "============================================================"

          grep -oE \
            'https?://[^"'\''<> ]+|href="[^"]+"' \
            archive/index.html \
            | grep -Ei \
              'snap-|snapshot|archive/' \
            | head -100 \
            || true

          echo
          echo "============================================================"
          echo " SEARCH FOR archivebox.localhost"
          echo "============================================================"

          grep -Rni \
            "archivebox.localhost" \
            archive/index.html \
            || true

          echo
          echo "============================================================"
          echo " SEARCH FOR snap- SUBDOMAIN"
          echo "============================================================"

          grep -Rni \
            "snap-" \
            archive/index.html \
            || true

          echo
          echo "============================================================"
          echo " ARCHIVEBOX CONFIG RELEVANT TO URL ROUTING"
          echo "============================================================"

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            config \
            | grep -Ei \
              'BASE_URL|SERVER_SECURITY_MODE|REPLAY|PUBLIC_INDEX|PERMISSIONS' \
            || true


      # ============================================================
      # 12. Verify generated static export
      # ============================================================
      - name: Verify static export
        run: |
          echo "============================================================"
          echo " GENERATED INDEX FILES"
          echo "============================================================"

          ls -lh archive/index.html archive/index.json

          echo
          echo "============================================================"
          echo " FIRST GENERATED LINKS"
          echo "============================================================"

          grep -oE 'href="[^"]+"' archive/index.html \
            | head -100 || true


      # ============================================================
      # 13. Upload COMPLETE original ArchiveBox data
      #
      # This is the untouched preservation copy.
      # ============================================================
      - name: Debug Folder Size
        run: du -sh ./archive && find ./archive -type f | wc -l

      - name: Generate static ArchiveBox files
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --html --with-headers > archive/index.html

          docker run --rm \
            -v "$GITHUB_WORKSPACE/archive:/data" \
            my-archivebox \
            list --json --with-headers > archive/index.json
      
           echo "Generated static files:"
          ls -lh "$GITHUB_WORKSPACE/archive/index.html"
          ls -lh "$GITHUB_WORKSPACE/archive/index.json"

          
      - name: Upload complete ArchiveBox output
        uses: actions/upload-artifact@v4
        with:
          name: archive-test-output
          path: archive/

          
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          # Point this to the folder containing your output file
          path: 'archive/' 



      # 2. Publish it live to the internet
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      


